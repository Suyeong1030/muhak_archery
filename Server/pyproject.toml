[project]
name = "artemis-server"
version = "0.1.0"
description = "Realtime FastAPI bridge between Unity and Artemis sensors"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.7,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "openai>=1.50,<2.0",
    "pillow>=11,<13",
    "matplotlib>=3.10,<4.0",
    "bleak>=1.0,<4.0",
]

[project.optional-dependencies]
gateway = [
    "httpx>=0.28,<1.0",
]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<10.0",
]

[project.scripts]
artemis-polar-h10 = "gateways.polar_h10:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "gateways"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
